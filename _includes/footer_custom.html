{%- if site.footer_content -%}
  <p class="text-small text-blue-000 mb-0">{{ site.footer_content }}</p>
{%- endif -%}
{% if page.url == "/" %}
  {% include titan_boot.html %}
{% endif %}
{% if page.custom_class %}
<canvas id="theme-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: -1;"></canvas>

<script>
(function() {
  const canvas = document.getElementById('theme-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const theme = "{{ page.custom_class }}";

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  // --- 1. PILOT THEME: Jump-Jet Speed Streaks ---
  if (theme === 'pilot-theme') {
    const streaks = Array.from({ length: 35 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      length: Math.random() * 25 + 10,
      speed: Math.random() * 3 + 1.5,
      opacity: Math.random() * 0.5 + 0.2
    }));

    function drawPilot() {
      ctx.clearRect(0, 0, width, height);
      streaks.forEach(s => {
        s.y -= s.speed;
        if (s.y < -30) {
          s.y = height + 30;
          s.x = Math.random() * width;
        }
        ctx.save();
        ctx.strokeStyle = '#00ff66';
        ctx.globalAlpha = s.opacity;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff66';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - 1, s.y + s.length);
        ctx.stroke();
        ctx.restore();
      });
      requestAnimationFrame(drawPilot);
    }
    drawPilot();
  }

  // --- 2. TITAN THEME: Shield Grid Energy Arcs ---
  else if (theme === 'titan-theme') {
    const nodes = Array.from({ length: 25 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6
    }));

    function drawTitan() {
      ctx.clearRect(0, 0, width, height);
      
      // Draw connecting energy arcs between close nodes
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 140) {
            ctx.save();
            ctx.strokeStyle = '#00f0ff';
            ctx.globalAlpha = (1 - dist / 140) * 0.25;
            ctx.lineWidth = 1;
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#00f0ff';
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      nodes.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > width) n.vx *= -1;
        if (n.y < 0 || n.y > height) n.vy *= -1;

        ctx.save();
        ctx.fillStyle = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f0ff';
        ctx.beginPath();
        ctx.arc(n.x, n.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(drawTitan);
    }
    drawTitan();
  }

  // --- 3. MAP THEME: Radar Sweep & Map Blips ---
  else if (theme === 'map-theme') {
    let sweepAngle = 0;
    const blips = Array.from({ length: 8 }, () => ({
      x: Math.random() * (width * 0.8) + (width * 0.1),
      y: Math.random() * (height * 0.8) + (height * 0.1),
      opacity: 0
    }));

    function drawMap() {
      ctx.clearRect(0, 0, width, height);
      sweepAngle += 0.008;

      // Draw faint tactical radar circles in background
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 157, 0, 0.08)';
      ctx.lineWidth = 1;
      const cx = width / 2;
      const cy = height / 2;
      [150, 300, 450].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Randomly pulse blips
      blips.forEach(b => {
        if (Math.random() < 0.01) b.opacity = 0.8;
        if (b.opacity > 0) b.opacity -= 0.005;

        if (b.opacity > 0) {
          ctx.fillStyle = '#ff9d00';
          ctx.globalAlpha = b.opacity;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#ff9d00';
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      requestAnimationFrame(drawMap);
    }
    drawMap();
  }

  // --- 4. ENEMY THEME: Battlefield Embers ---
  else if (theme === 'battlefield-theme') {
    const particles = Array.from({ length: 40 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 3 + 1.8,
      speedY: Math.random() * 0.8 + 0.3,
      speedX: (Math.random() - 0.5) * 0.5,
      baseOpacity: Math.random() * 0.35 + 0.35,
      pulseAngle: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.05 + 0.02,
      color: Math.random() > 0.35 ? '#ff5500' : '#ffaa00'
    }));

    function drawEmbers() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        p.pulseAngle += p.pulseSpeed;
        const dynamicOpacity = Math.max(0.1, Math.min(0.95, p.baseOpacity + Math.sin(p.pulseAngle) * 0.3));

        if (p.y < -15) {
          p.y = height + 15;
          p.x = Math.random() * width;
        }

        ctx.save();
        ctx.globalAlpha = dynamicOpacity;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = p.size * 3;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(drawEmbers);
    }
    drawEmbers();
  }
})();
</script>
{% endif %}
